</style>
</head><body>
<div class="app-shell">
<header class="topbar">
  <div class="brand"><div class="brand-logo">VIETMAP<sup>®</sup></div><div class="brand-divider"></div><div><div class="brand-title">LOGISTICS CONTROL TOWER</div><div class="brand-sub">Dữ liệu chính xác · Quyết định kịp thời · Hiệu quả bền vững</div></div></div>
  <div class="top-actions"><label class="month-picker"><span>Kỳ báo cáo</span><select id="month"></select></label></div>
</header>
<main class="dashboard">
<section class="report-head"><div><div class="eyebrow">LOGISTICS PERFORMANCE · EXECUTIVE VIEW</div><h1>Hiệu suất Logistics <span id="monthBadge"></span></h1><p id="subtitle"></p></div><div class="report-total"><span>TỔNG ĐƠN GIAO</span><strong id="heroOrders">—</strong><div id="heroDelta"></div></div></section>
<section class="grid-12" id="kpis"></section>
<section class="grid-12 reference-bottom">
  <article class="panel span-12"><div class="panel-head"><div><h2>So sánh hiệu suất theo khu vực</h2></div></div><div class="table-wrap"><table id="tbl"></table></div></article>
</section>
</main></div>
<script>
// SEED ĐÃ ĐƯỢC CẬP NHẬT ĐỦ 9 THÁNG (2026-01 -> 2026-09)
const SEED = {

};

const KEY="logistics_dashboard_v1";
localStorage.setItem(KEY, JSON.stringify(SEED));
const DATA = SEED;
const $ = id => document.getElementById(id);
const fmt = (x,d=0) => x.toLocaleString("vi-VN",{minimumFractionDigits:d,maximumFractionDigits:d});
const keys = () => Object.keys(DATA).sort();
const lab = k => "Tháng "+(+k.slice(5))+"/"+k.slice(0,4);

function render(mk) {
  $("monthBadge").textContent = lab(mk);
  const m = DATA[mk];
  const tot = Object.values(m.orders).reduce((a,b)=>a+b,0);
  $("heroOrders").textContent = fmt(tot);
  
  const rows = Object.keys(m.orders).map(v => {
    return `<tr><td><b>VP ${v.toUpperCase()}</b></td><td>${fmt(m.orders[v])}</td><td>${fmt(m.fresh[v])}</td><td>${fmt(m.ret[v])}</td><td>${fmt(m.km[v],2)}</td><td>${fmt(m.ot[v],1)}</td></tr>`;
  }).join("");
  $("tbl").innerHTML = '<thead><tr><th>Khu vực</th><th>Đơn giao</th><th>Đơn mới</th><th>Đơn trả</th><th>Km/đơn</th><th>Giờ OT</th></tr></thead><tbody>' + rows + '</tbody>';
}

function populate() {
  $("month").innerHTML = keys().reverse().map(k => `<option value="${k}">${lab(k)}</option>`).join("");
  $("month").value = keys().slice(-1)[0];
  render($("month").value);
}

$("month").addEventListener("change", e => render(e.target.value));
populate();
</script></body></html>
